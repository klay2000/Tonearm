name: Release

# Fires when a version tag like "1.2.3" is pushed (conventionally from main).
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Build web app
        run: npm run build

      - name: Package web build
        run: (cd dist && zip -r "../tonearm-web-${{ github.ref_name }}.zip" .)

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev build-essential libssl-dev \
            patchelf gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav

      - name: Build desktop AppImage
        run: npm run tauri build

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "tonearm-web-${{ github.ref_name }}.zip" \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            --title "${{ github.ref_name }}" \
            --generate-notes
